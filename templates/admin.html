<!DOCTYPE html>
<html>
<head>
    <title>Agneyra Chat Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #e5ddd5;
            display: flex;
            height: 100vh;
        }

        /* LEFT SIDEBAR */
        .sidebar {
            width: 30%;
            background: #111b21;
            color: white;
            overflow-y: auto;
        }

        .sidebar h3 {
            padding: 20px;
            margin: 0;
            background: #202c33;
        }

        .user-item {
            padding: 15px;
            border-bottom: 1px solid #2a3942;
            cursor: pointer;
        }

        .user-item:hover {
            background: #2a3942;
        }

        .user-item a {
            color: white;
            text-decoration: none;
        }

        /* RIGHT CHAT AREA */
        .chat-area {
            width: 70%;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            background: #202c33;
            color: white;
            padding: 15px;
        }

        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #e5ddd5;
        }

        .message {
            max-width: 60%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
            word-wrap: break-word;
        }

        .user {
            background: #dcf8c6;
            margin-left: auto;
        }

        .bot {
            background: white;
        }

        /* SEND PANEL */
        .send-panel {
            background: #202c33;
            padding: 10px;
            color: white;
        }

        .send-panel input[type="text"] {
            width: 60%;
            padding: 8px;
            border-radius: 4px;
            border: none;
        }

        .send-panel button {
            padding: 8px 12px;
            border: none;
            background: #25D366;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }

        .send-panel button:hover {
            background: #128C7E;
        }

        .broadcast-box {
            background:#202c33;
            padding:10px;
            color:white;
        }

    </style>
</head>
<script>

function loadMessages() {

    const phone = "{{ phone }}";

    if (!phone) return;

    fetch("/get_messages/" + phone)
    .then(res => res.json())
    .then(data => {

        const chatBox = document.querySelector(".chat-box");

        chatBox.innerHTML = "";

        data.messages.forEach(msg => {

            const div = document.createElement("div");

            div.className = "message " + msg.type;

            div.innerText = msg.message;

            chatBox.appendChild(div);

        });

    });

}

/* refresh every 2 seconds */

setInterval(loadMessages, 2000);

</script>

<body>

<!-- LEFT SIDE USER LIST -->
<div class="sidebar">
    <h3>Users</h3>

{% for user in all_users %}
<div class="user-item">

<a href="/admin?phone={{ user[0] }}">

{{ user[0] }}

{% if user[1] == 1 %}
<span style="background:red;color:white;padding:3px 6px;border-radius:5px;font-size:12px;margin-left:8px;">
ISSUE
</span>
{% endif %}

</a>

</div>
{% endfor %}
</div>

<!-- RIGHT SIDE CHAT -->
<div class="chat-area">

    <div class="chat-header">
        Chat with: {{ phone }}
    </div>

    <!-- BROADCAST MESSAGE -->
    <div class="broadcast-box">

        <h3>Broadcast Message</h3>

        <form action="/broadcast" method="POST">

            <input type="text"
                   name="message"
                   placeholder="Send message to all users..."
                   style="width:70%;padding:8px">

            <button type="submit"
                    style="background:#25D366;color:white;padding:8px;border:none">
                Send to All
            </button>

        </form>

    </div>

    <!-- DELETE CHAT -->
    <form action="/delete_chat" method="POST">
        <input type="hidden" name="phone" value="{{ phone }}">
        <button type="submit" style="background:red;color:white;padding:6px;border:none;border-radius:4px;">
            Delete Chat
        </button>
    </form>

    <!-- CHAT BOX -->
    <div class="chat-box">
        {% for msg in messages %}
            <div class="message {{ msg.type }}">
                {{ msg.message }}
            </div>
        {% endfor %}
    </div>

    <!-- SEND OPTIONS -->
    <div class="send-panel">

        <!-- TEXT MESSAGE -->
        <form action="/send" method="POST">
            <input type="hidden" name="phone" value="{{ phone }}">

            <input type="text" name="message"
                   placeholder="Type message...">

            <button type="submit">Send</button>
        </form>

        <br>

        <!-- IMAGE -->
        <form action="/send_image" method="POST" enctype="multipart/form-data">
            <input type="hidden" name="phone" value="{{ phone }}">
            <input type="file" name="file">
            <button type="submit">Send Image</button>
        </form>

        <br>

        <!-- DOCUMENT -->
        <form action="/send_certificate" method="POST" enctype="multipart/form-data">
            <input type="hidden" name="phone" value="{{ phone }}">
            <input type="file" name="file">
            <button type="submit">Send Document</button>
        </form>

    </div>

</div>

</body>
</html>
