<!DOCTYPE html>
<html>
<head>
    <title>Chat History</title>
    <style>
        body { font-family: Arial; background:#f4f6f9; padding:20px; }
        .chat-box { max-width:600px; margin:auto; }
        .user { background:#d1e7dd; padding:10px; margin:5px; border-radius:8px; text-align:right; }
        .bot { background:#ffffff; padding:10px; margin:5px; border-radius:8px; }
    </style>
</head>
<body>
    <h2>Chat History - {{ phone }}</h2>
    <div class="chat-box">
        {% for msg in messages %}
            <div class="{{ msg.type }}">
                {{ msg.message }}
            </div>
        {% endfor %}
    </div>
</body>
</html>
