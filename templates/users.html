<!DOCTYPE html>
<html>
<head>
    <title>All Users</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
            padding: 20px;
        }

        .user-card {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            box-shadow: 0px 2px 5px rgba(0,0,0,0.1);
        }

        a {
            text-decoration: none;
            color: #25D366;
            font-weight: bold;
        }

        a:hover {
            color: #128C7E;
        }
    </style>
</head>
<body>

<h2>All WhatsApp Users</h2>

{% for user in users %}
    <div class="user-card">
        <a href="/history/{{ user }}">
            {{ user }}
        </a>
    </div>
{% endfor %}

</body>
</html>
